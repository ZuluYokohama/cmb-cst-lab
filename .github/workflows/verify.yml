name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Local tests (injection on synthetic HEALPix maps, bootstrap draws; XPU tests skip)
        run: python -m pytest -q
      - name: Sandbox suites under plain pytest (same ast bundles as JoVin, no receipts)
        run: python scripts/run_sandbox_suites.py
