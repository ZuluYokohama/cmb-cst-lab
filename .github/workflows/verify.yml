name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Local tests (synthetic HEALPix injection and bootstrap; unavailable GPUs skip)
        run: python -m pytest -q
      - name: Sandbox suites under plain pytest (same ast bundles as JoVin, no receipts)
        run: python scripts/run_sandbox_suites.py

  cutsky-integration:
    name: Actual NaMaster integration
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documented native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgsl-dev libfftw3-dev libcfitsio-dev autoconf automake libtool
      - name: Install the pinned optional integration profile
        run: python -m pip install -e ".[dev,cutsky]"
      - name: Require actual optional backends before compatibility tests
        run: python -c "import astropy.io.fits,ducc0,h5py,healpy,pymaster; import importlib.metadata as m; assert all(m.version(k)==v for k,v in {'h5py':'3.16.0','healpy':'1.20.1','fitsio':'1.4.2','pymaster':'3.0.1'}.items())"
      - name: Exercise real map and cut-sky backends
        run: python -m pytest -q tests/test_integration_io.py tests/test_integration_operators.py tests/test_integration_api.py tests/test_integration_namaster.py tests/test_integration_map_residual.py tests/test_cutsky_driver.py

  lean:
    name: Lean rational invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify pinned official Lean compiler
        shell: bash
        run: |
          curl -L --fail --retry 2 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
      - name: Kernel-check supporting algebra
        run: python3 scripts/verify_lean.py --lean "$RUNNER_TEMP/lean/bin/lean" --archive "$RUNNER_TEMP/lean.tar.zst" --output "$RUNNER_TEMP/lean-verification.json"
      - name: Kernel-check polarization geometry
        run: '"$RUNNER_TEMP/lean/bin/lean" formal/PolarizationGeometry.lean'
      - name: Kernel-check operational closure and exact counterexample
        run: '"$RUNNER_TEMP/lean/bin/lean" formal/OperationalClosure.lean'
      - name: Kernel-check the recorded v2 witness and its evidence bindings
        run: python3 scripts/verify_closure_v2_witness_lean.py --lean "$RUNNER_TEMP/lean/bin/lean" --archive "$RUNNER_TEMP/lean.tar.zst" --cache-dir "$RUNNER_TEMP/closure-v2-lean" --output "$RUNNER_TEMP/closure-v2-witness.json"
