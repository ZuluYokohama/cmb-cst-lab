name: provenance guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notices-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Check traceability inventory and upstream license notice
        run: python scripts/provenance_audit.py check
      - name: Exercise deterministic public inventory
        run: python scripts/provenance_audit.py inventory --summary
      - name: Scan reachable Git history for credential signatures (redacted)
        run: python scripts/history_credential_scan.py
