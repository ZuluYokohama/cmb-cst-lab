name: provenance guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notices-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check traceability inventory and upstream license notice
        run: python scripts/provenance_audit.py check
      - name: Exercise deterministic public inventory
        run: python scripts/provenance_audit.py inventory --summary
