[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmbcst"
version = "0.1.0"
description = "Reproduction of the Lonappan-Keating-Arnold (2026) differential calibration network on Planck PR4, with a cochain/Hodge reading"
requires-python = ">=3.11"
# ships the upstream MIT notice for the mk_likelihood.py port in built distributions (PEP 639)
license-files = ["THIRD_PARTY_LICENSES/*"]
dependencies = ["numpy>=2", "scipy", "astropy", "ducc0", "camb", "requests", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]
# Intel Arc / XPU: pip install torch --index-url https://download.pytorch.org/whl/xpu
gpu = ["torch", "openvino"]
# NVIDIA CUDA: install the matching torch wheel from pytorch.org first.
cuda = ["torch>=2.9"]
# First integration profile; tested versions are pinned separately from old runs.
integration = ["h5py==3.16.0", "healpy==1.20.1"]
cutsky = ["h5py==3.16.0", "healpy==1.20.1", "fitsio==1.4.2", "pymaster==3.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/sandbox"]
pythonpath = ["src"]
